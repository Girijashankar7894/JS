    <title>Cookies</title>
</head>
<body>
    
    <script>
        // add cookies name and value
        document.cookie = "item = Saree";

        // add another cookies name-value, expires, path, secure, samesite

        // delete cookies: for delete a cookies you can put the backdate value at expires properties.
        // document.cookie = "itemName=Cake; Expires=Thu, 19 Aug 2026 12:00:00 UTC";
    </script>

</body>
